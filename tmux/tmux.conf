# ─── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
# True colour for the outer terminal (kitty sets TERM=xterm-kitty).
set -as terminal-features ",xterm-256color:RGB,xterm-kitty:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on

# ─── Remote use (ssh from work) ──────────────────────────────────────────────
# OSC 52: yanks reach the clipboard of the machine you're typing on, also over ssh.
set -g set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard,xterm-256color:clipboard'
# Refreshed on attach (DISPLAY/XAUTHORITY are by default); nvim reads them back
# with show-environment when its clipboard tool fails.
set -ga update-environment WAYLAND_DISPLAY
# Terminal tab/window title on the outer machine: host, session, window.
set -g set-titles on
set -g set-titles-string "#h: #S / #W"
# Killing the last window of a session switches to another session instead of
# detaching you.
set -g detach-on-destroy off

# ─── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── Splits (open in current path) ───────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (vim-style) ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim-tmux-navigator takes C-l; <prefix> C-l clears the screen instead.
bind C-l send-keys C-l

# ─── Reload config ───────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── AI chat pane ────────────────────────────────────────────────────────────
# prefix + A  → open/toggle a right-hand aichat pane (25% width)
bind-key A split-window -h -l 25% -c "#{pane_current_path}" "aichat"

# ─── AI popup (prefix + G) ───────────────────────────────────────────────────
# Sends the last 50 lines of the active pane to aichat as context.
# Usage: run a command, see an error, press prefix+G, describe the problem.
bind-key G run-shell \
  'tmux capture-pane -p -S -50 | aichat "Context from my terminal (last 50 lines). Help me understand or fix this:" 2>&1 | tmux display-popup -E -w 80% -h 80% "cat"'

# Simpler variant — just opens aichat in a full popup:
bind-key g display-popup -E -w 80% -h 80% "aichat"

# ─── Git TUI ─────────────────────────────────────────────────────────────────
bind-key L display-popup -E -w 90% -h 90% "lazygit"

# ─── Copy mode (vi keys) ─────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Clipboard via OSC 52 (set-clipboard on): works locally and over ssh, no xclip.
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ─── Status bar ──────────────────────────────────────────────────────────────
# status-style and window styles come from catppuccin (set when it loads).
set -g status-position top
set -g status-left "#[fg=#5f87af,bold] #S "
set -g status-right "#[fg=#666666]%H:%M  %d %b "
set -g status-left-length 30

# ─── TPM plugins ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # C-hjkl across vim+tmux panes
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
# Label windows with their name (#W: <prefix> , to rename; otherwise the running
# command) instead of the pane title (#T), which is just the hostname.
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'      # start tmux (and restore) at boot; needs: loginctl enable-linger

run '~/.tmux/plugins/tpm/tpm'

