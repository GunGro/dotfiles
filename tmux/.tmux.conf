# ─── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on

# ─── Prefix ──────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─── Splits (open in current path) ───────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# ─── Pane navigation (vim-style) ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Reload config ───────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ─── AI chat pane ────────────────────────────────────────────────────────────
# prefix + A  → open/toggle a right-hand aichat pane (25% width)
bind-key A split-window -h -p 25 -c "#{pane_current_path}" "aichat"

# ─── AI popup (prefix + G) ───────────────────────────────────────────────────
# Sends the last 50 lines of the active pane to aichat as context.
# Usage: run a command, see an error, press prefix+G, describe the problem.
bind-key G run-shell \
  'tmux capture-pane -p -S -50 | aichat "Context from my terminal (last 50 lines). Help me understand or fix this:" 2>&1 | tmux display-popup -E -w 80% -h 80% "cat"'

# Simpler variant — just opens aichat in a full popup:
bind-key g display-popup -E -w 80% -h 80% "aichat"

# ─── Copy mode (vi keys) ─────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# ─── Status bar ──────────────────────────────────────────────────────────────
set -g status-position top
set -g status-style "bg=#1c1c1c,fg=#aaaaaa"
set -g status-left "#[fg=#5f87af,bold] #S "
set -g status-right "#[fg=#666666]%H:%M  %d %b "
set -g status-left-length 30
set -g window-status-current-style "fg=#ffffff,bold"

# ─── TPM plugins ─────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save sessions
set -g @plugin 'christoomey/vim-tmux-navigator' # C-hjkl across vim+tmux panes

set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'

