# ─── Theme (Catppuccin Mocha — matches nvim colorscheme) ────────────────────
include mocha.conf

# ─── Font ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# ─── Cursor ──────────────────────────────────────────────────────────────────
cursor_shape     beam
cursor_blink_interval 0

# ─── Window ──────────────────────────────────────────────────────────────────
window_padding_width 4
hide_window_decorations no
confirm_os_window_close 0

# ─── Scrollback ──────────────────────────────────────────────────────────────
scrollback_lines 10000

# ─── Terminal identification ─────────────────────────────────────────────────
# Kitty's own terminfo (xterm-kitty) is best locally, but plain xterm-256color
# is safer for compatibility with tmux/remote hosts that don't have kitty's
# terminfo installed. Use the ssh kitten (Step 5) instead of overriding this
# unless you hit problems.
# term xterm-256color

# ─── Shell integration ───────────────────────────────────────────────────────
shell_integration enabled

# ─── tmux/nvim true color ─────────────────────────────────────────────────────
# Kitty supports true color natively — nothing extra needed here.
# Your tmux.conf already forces RGB via terminal-overrides, and Neovim's
# `vim.opt.termguicolors = true` picks it up automatically.
